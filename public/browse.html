<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost &amp; Found · Browse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header></header>
  <main>
    <div class="page-head">
      <div>
        <h1 id="title">Found items</h1>
        <p class="muted" id="count"></p>
      </div>
      <div class="toggle" id="type-toggle">
        <button data-type="found" class="on">Found</button>
        <button data-type="lost">Lost</button>
        <button data-type="">Both</button>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <select id="category"></select>
        <select id="province"></select>
        <select id="city"></select>
        <select id="office"></select>
        <select id="status">
          <option value="">Still looking (open)</option>
          <option value="all">Any status</option>
          <option value="matched">Matched</option>
          <option value="claimed">Claimed</option>
          <option value="returned">Returned</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="row" style="margin-top: 10px">
        <label class="inline small">From <input type="date" id="from" style="width: auto; padding: 5px 8px"></label>
        <label class="inline small">To <input type="date" id="to" style="width: auto; padding: 5px 8px"></label>
        <span class="small muted" id="search-note"></span>
        <button class="link" id="clear">Clear filters</button>
      </div>
    </div>

    <div class="board" id="board"></div>
  </main>

  <script src="js/common.js"></script>
  <script>
    let type = param('type') ?? 'found';
    let user;

    async function load() {
      const p = new URLSearchParams();
      if (param('q')) p.set('q', param('q'));
      if (type) p.set('type', type);
      for (const [id, key] of [['category', 'categoryId'], ['province', 'provinceId'], ['city', 'cityId'], ['office', 'officeId'], ['from', 'from'], ['to', 'to']]) {
        const v = document.getElementById(id).value;
        if (v) p.set(key, v);
      }
      const status = document.getElementById('status').value;
      if (status === '') p.set('active', '1');
      else if (status !== 'all') p.set('status', status);
      if (param('notReceived')) p.set('notReceived', '1');
      if (param('mine')) p.set('mine', '1');
      const items = await api(`/api/items?${p}`);
      document.getElementById('title').textContent = type === 'lost' ? 'Lost items' : type === 'found' ? 'Found items' : 'Lost and found items';
      document.getElementById('count').textContent = `${items.length} item${items.length === 1 ? '' : 's'}${items.length === 300 ? ' (first 300 – narrow the filters)' : ''}`;
      document.getElementById('search-note').innerHTML = param('q') ? `Search: <strong>${esc(param('q'))}</strong>` : '';
      document.getElementById('board').innerHTML = items.length ? items.map(tagCard).join('')
        : `<div class="board-empty" style="grid-column: 1 / -1">Nothing matches these filters.${type === 'found' && user.role === 'member' ? '<br><a href="report.html?type=lost">Report your item as lost</a> and we\'ll tell you when it turns up.' : ''}</div>`;
    }

    (async () => {
      user = await requireUser();
      if (user.role === 'member') document.getElementById('type-toggle').classList.add('hidden'); // members browse found items
      if (user.role === 'member') type = 'found';
      document.querySelectorAll('#type-toggle button').forEach((b) => {
        b.classList.toggle('on', b.dataset.type === type);
        b.onclick = () => { type = b.dataset.type; document.querySelectorAll('#type-toggle button').forEach((x) => x.classList.toggle('on', x === b)); load(); };
      });
      const [categories, offices] = await Promise.all([api('/api/categories?all=1'), api('/api/offices')]);
      document.getElementById('category').innerHTML = optionsHtml(categories, param('categoryId'), 'All categories', (c) => `${catIcon(c.name)} ${c.name}`);
      document.getElementById('office').innerHTML = optionsHtml(offices, param('officeId'), 'All offices', (o) => `${OFFICE_ICON[o.lfo_type]} ${o.name}`);
      const picker = await cityPicker(document.getElementById('province'), document.getElementById('city'), { placeholderAll: 'All', onChange: load });
      if (param('cityId')) picker.set(param('cityId'));
      if (param('status')) document.getElementById('status').value = param('status');
      if (param('active')) document.getElementById('status').value = '';
      ['category', 'office', 'status', 'from', 'to'].forEach((id) => { document.getElementById(id).onchange = load; });
      document.getElementById('clear').onclick = () => { location.href = 'browse.html'; };
      await load();
    })();
  </script>
</body>
</html>
