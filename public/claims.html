<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost &amp; Found · Claims</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header></header>
  <main class="narrow">
    <div class="page-head">
      <div>
        <h1 id="title">Claims</h1>
        <p class="muted" id="intro"></p>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div class="toggle" id="status-toggle">
          <button data-status="open" class="on">Open</button>
          <button data-status="pending">Pending</button>
          <button data-status="under_review">Under review</button>
          <button data-status="approved">Approved</button>
          <button data-status="">All</button>
        </div>
        <input type="search" id="q" placeholder="Item, reference or claimant…" style="flex: 1; min-width: 180px; width: auto">
      </div>
    </div>
    <div id="list"></div>
  </main>

  <script src="js/common.js"></script>
  <script>
    let status = param('status') === 'open' || !param('status') ? 'open' : param('status');
    let user;
    async function load() {
      const p = new URLSearchParams();
      if (status === 'open') p.set('open', '1'); else if (status) p.set('status', status);
      if (document.getElementById('q').value.trim()) p.set('q', document.getElementById('q').value.trim());
      if (user.role === 'member') p.set('mine', '1');
      const claims = await api(`/api/claims?${p}`);
      document.getElementById('list').innerHTML = claims.length ? claims.map((c) => `
        <a class="card list-item" href="claim.html?id=${c.id}"><span class="thumb">${catIcon(c.category)}</span>
          <span class="body"><span class="row">${claimPill(c.status_code, c.status)}
            ${user.role !== 'member' && c.rejected_claims >= 2 ? `<span class="pill warn">⚠ ${c.rejected_claims} rejected claims</span>` : ''}
            ${user.role !== 'member' && !c.received_at ? '<span class="pill s-waiting">Item not handed in yet</span>' : ''}</span>
          <span class="item-title" style="display: block">${esc(c.item_name)} <span class="small muted">${esc(c.found_ref)}</span></span>
          <span class="meta">${user.role === 'member' ? esc(c.office_name) : `${esc(c.claimant || 'former member')} · ${esc(c.office_name)}`} · claimed ${timeAgo(c.claim_date)}</span></span></a>`).join('')
        : '<div class="card empty">No claims here.</div>';
    }
    (async () => {
      user = await requireUser();
      document.getElementById('title').textContent = user.role === 'member' ? 'My claims' : 'Claims';
      document.getElementById('intro').textContent = user.role === 'member'
        ? 'Items you said are yours. The office checks your description and lets you know.'
        : user.role === 'office_admin' ? 'Claims on items kept by your office. Compare the description with the secret details before approving.' : 'Claims at all offices.';
      document.querySelectorAll('#status-toggle button').forEach((b) => {
        b.classList.toggle('on', b.dataset.status === status);
        b.onclick = () => { status = b.dataset.status; document.querySelectorAll('#status-toggle button').forEach((x) => x.classList.toggle('on', x === b)); load(); };
      });
      let t;
      document.getElementById('q').oninput = () => { clearTimeout(t); t = setTimeout(load, 300); };
      await load();
    })();
  </script>
</body>
</html>
